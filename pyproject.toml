[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kawaneen"
version = "0.1.0"
description = "Foundation for jurisdiction-aware Arabic legal and regulatory intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kawaneen contributors" }]
dependencies = [
    "huggingface_hub>=0.27,<1",
    "pyarrow>=18,<20",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=24.4,<26",
]

[project.scripts]
kawaneen = "kawaneen.cli:main"

[project.optional-dependencies]
parsing = [
    "docling>=2.0,<3",
    "onnxruntime>=1.18,<2",
    "pypdf>=5,<6",
    "pypdfium2>=5,<6",
    "python-bidi>=0.4,<1",
    "rapidocr>=3.5,<4",
]
retrieval = [
    "bm25s>=0.2,<1",
    "faiss-cpu>=1.9,<2; platform_machine != 'arm64' or sys_platform != 'darwin'",
    "sentence-transformers>=3.3,<6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5",
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kawaneen"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "private_artifact: requires intentionally untracked local corpora, frozen private experiment artifacts, or model caches",
]

[tool.coverage.run]
branch = true
source = ["kawaneen"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]
omit = [
    # Offline evaluation releases and adjudication tooling require intentionally untracked inputs.
    "src/kawaneen/evaluation/adjudication_v4.py",
    "src/kawaneen/evaluation/adjudication_v5.py",
    "src/kawaneen/evaluation/balance.py",
    "src/kawaneen/evaluation/candidates.py",
    "src/kawaneen/evaluation/candidates_v3.py",
    "src/kawaneen/evaluation/corpus.py",
    "src/kawaneen/evaluation/diagnostics.py",
    "src/kawaneen/evaluation/handoff.py",
    "src/kawaneen/evaluation/literal_patch.py",
    "src/kawaneen/evaluation/orchestrator.py",
    "src/kawaneen/evaluation/semantic_targets.py",
    "src/kawaneen/evaluation/serialization.py",
    # Model/provider and persisted-result experiment plumbing is not public CI runtime code.
    "src/kawaneen/generation/evaluation.py",
    "src/kawaneen/generation/generator.py",
    "src/kawaneen/generation/orchestration.py",
    "src/kawaneen/generation/registry.py",
    "src/kawaneen/generation/stage_d_evaluation.py",
    "src/kawaneen/generation/timeout_diagnostic.py",
    "src/kawaneen/generation/transformers.py",
    # Phase 8/9 private artifact readers and context-pack persistence.
    "src/kawaneen/grounding/artifacts.py",
    "src/kawaneen/grounding/dev.py",
    "src/kawaneen/grounding/inputs.py",
    "src/kawaneen/retrieval/hybrid/finalization.py",
    "src/kawaneen/retrieval/hybrid/orchestration.py",
    # Local corpus/normalization/chunking build orchestrators consume ignored corpora.
    "src/kawaneen/corpus/orchestrator.py",
    "src/kawaneen/chunking/orchestrator.py",
    "src/kawaneen/normalization/orchestrator.py",
    "src/kawaneen/normalization/sensitivity.py",
    # Phase 11 private model-run, checkpoint, readiness, and offline evaluation tooling.
    "src/kawaneen/extraction/checkpoints.py",
    "src/kawaneen/extraction/hybrid_runtime.py",
    "src/kawaneen/extraction/orchestration.py",
    "src/kawaneen/extraction/prompt.py",
    "src/kawaneen/extraction/provider.py",
    "src/kawaneen/extraction/readiness.py",
    "src/kawaneen/extraction/stage_b1_evaluation.py",
]

[tool.pyright]
include = ["src/kawaneen"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
