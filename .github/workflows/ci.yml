name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev --all-extras --python "${{ matrix.python-version }}"
      - run: |
          .venv/bin/python --version
          .venv/bin/python -c "import sys; expected='${{ matrix.python-version }}'; actual=f'{sys.version_info.major}.{sys.version_info.minor}'; assert actual == expected, f'expected {expected}, got {actual}'"
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ruff check .
      - run: uv run --no-sync pyright
      - run: .venv/bin/pytest
